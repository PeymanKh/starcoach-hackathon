[project]
name = "starcoach-hackathon"
version = "0.1.0"
description = "My Hackathon Project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.3",
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "langchain>=1.4.7",
    "langchain-openrouter>=0.2.9",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
data = [
    "jupyter>=1.1.1",
    "pandas>=3.0.6",
]
dev = [
    "django-stubs>=6.1.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-env>=1.8.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations/*", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "basic"
exclude = ["**/migrations", "**/__pycache__", ".venv"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
env = [
  "DJANGO_SECRET_KEY=test-key-not-for-prod",
  "DATABASE_URL=postgres://app:app@localhost:5433/app",
]
